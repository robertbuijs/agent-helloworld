[project]
name = "enterprise-assistant"
version = "0.1.0"
description = "Phase 1 ADK conversational agent: read-only Jira + GitHub for Gemini Enterprise"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "google-adk>=1.5.0",
  "google-cloud-aiplatform[agent_engines,adk]>=1.100.0",
  "mcp>=1.9.0",
  "python-dotenv>=1.0.0",
  "google-cloud-secret-manager>=2.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
